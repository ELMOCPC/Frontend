<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="پنجمین دوره مسابقات برنامه‌نویسی دانشجویی دانشگاه علم و صنعت — ELMOCPC 2025"
    />
    <title>ELMOCPC 2025 — دعوت به تیم</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Auth shell (G5): centered card over BG.png, corner logos, no global nav -->
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="accept-title">
        <header class="form-header">
          <!-- source decorative 👥 replaced by lucide-style SVG (G7 / emoji: drop) -->
          <span class="form-icon form-icon-round">
            <svg
              class="icon-lg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
          </span>
          <h1 class="form-title" id="accept-title">دعوت به تیم</h1>
          <p class="form-desc">آیا می‌خواهید به این تیم اضافه شوید؟</p>
        </header>

        <div class="form-actions form-actions-fill">
          <button class="btn btn-yellow btn-lg" type="button">قبول دعوت</button>
          <button class="btn btn-ghost btn-lg" type="button">رد کردن</button>
        </div>
      </section>

      <a href="index.html">
        <img
          class="corner-logo corner-logo-start"
          src="../../src/assets/ELMOCPC.svg"
          alt="ELMOCPC"
        />
      </a>
      <img
        class="corner-logo corner-logo-end"
        src="../../src/assets/CESA.svg"
        alt="CESA"
      />
    </main>
  </body>
</html>
