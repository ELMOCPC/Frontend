<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="پنجمین دوره مسابقات برنامه‌نویسی دانشجویی دانشگاه علم و صنعت — ELMOCPC 2025"
    />
    <title>ELMOCPC 2025 — ورود</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Auth shell (G5): centered card over BG.png, corner logos, no global nav -->
    <main class="auth-page">
      <section class="auth-card" aria-labelledby="login-title">
        <header class="form-header">
          <h1 class="form-title" id="login-title">ورود به حساب کاربری</h1>
        </header>

        <form>
          <div class="form-stack">
            <div class="fl">
              <input
                class="input fl-control"
                id="login-email"
                name="email"
                type="email"
                placeholder=" "
                autocomplete="email"
              />
              <label class="fl-label" for="login-email">ایمیل</label>
            </div>

            <div class="form-actions">
              <button class="btn btn-yellow btn-lg btn-block" type="submit">
                دریافت کد تایید
              </button>
            </div>
          </div>
        </form>

        <p class="form-foot">
          حساب کاربری ندارید؟
          <a class="link" href="signup.html">ثبت‌نام کنید</a>
        </p>
      </section>

      <a href="index.html">
        <img
          class="corner-logo corner-logo-start"
          src="../../src/assets/ELMOCPC.svg"
          alt="ELMOCPC"
        />
      </a>
      <img
        class="corner-logo corner-logo-end"
        src="../../src/assets/CESA.svg"
        alt="CESA"
      />
    </main>
  </body>
</html>
