<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="پنجمین دوره مسابقات برنامه‌نویسی دانشجویی دانشگاه علم و صنعت — ELMOCPC 2025"
    />
    <title>ELMOCPC 2025 — ثبت‌نام تیم</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Auth shell (G5): progress bar + centered card over BG.png, no global nav -->
    <main class="auth-page">
      <div class="auth-stack">
        <!-- 4-step progress bar — default state: step 1 active, steps 2–4 upcoming -->
        <ol class="steps steps-bar">
          <li class="step is-active" aria-current="step">
            <span class="step-dot">
              <svg
                class="icon-sm"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="8" r="6" />
                <path
                  d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"
                />
              </svg>
            </span>
            <span class="step-label">نام و توضیح تیم</span>
          </li>
          <li class="step is-upcoming">
            <span class="step-dot">
              <svg
                class="icon-sm"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <span class="step-label">عضو دوم</span>
          </li>
          <li class="step is-upcoming">
            <span class="step-dot">
              <svg
                class="icon-sm"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
            <span class="step-label">عضو سوم</span>
          </li>
          <li class="step is-upcoming">
            <span class="step-dot">
              <svg
                class="icon-sm"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="m9 12 2 2 4-4" />
              </svg>
            </span>
            <span class="step-label">تایید نهایی</span>
          </li>
        </ol>

        <section class="auth-card auth-card-wide" aria-labelledby="buildteam-title">
          <header class="form-header">
            <span class="form-icon">
              <svg
                class="icon-lg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </span>
            <h1 class="form-title" id="buildteam-title">ثبت‌نام تیم</h1>
            <p class="form-desc">نام و توضیحات تیم خود را وارد کنید</p>
          </header>

          <form>
            <div class="form-stack">
              <div class="fl">
                <input
                  class="input fl-control"
                  id="team-name"
                  name="team_name"
                  type="text"
                  placeholder=" "
                />
                <label class="fl-label" for="team-name">نام تیم</label>
              </div>

              <div class="fl">
                <textarea
                  class="textarea fl-control"
                  id="team-desc"
                  name="team_description"
                  placeholder=" "
                ></textarea>
                <label class="fl-label" for="team-desc"
                  >توضیحات تیم (اختیاری)</label
                >
              </div>

              <div class="form-actions">
                <button class="btn btn-yellow btn-lg btn-block" type="submit">
                  ادامه
                </button>
              </div>
            </div>
          </form>
        </section>
      </div>

      <a href="index.html">
        <img
          class="corner-logo corner-logo-start"
          src="../../src/assets/ELMOCPC.svg"
          alt="ELMOCPC"
        />
      </a>
      <img
        class="corner-logo corner-logo-end"
        src="../../src/assets/CESA.svg"
        alt="CESA"
      />
    </main>
  </body>
</html>
